<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 화면 — 하루살림</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">

<!-- 동의 배너 (태그 관리자보다 먼저) -->
<script src="assets/consent.js"></script>

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],

<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQ9XCH2B"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">하루살림</a>
</div></header>

<main><div class="wrap">
  <h2>관리 화면</h2>

  <!-- 관리 화면 입구 - 로그인 토큰의 커스텀 클레임 role 로 판단한다 (assets/admin.js) -->
  <section id="gate" class="pay" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:560px">
    <p id="gate-status" style="margin:0;font-size:17px;font-weight:600">확인하는 중…</p>
    <div id="gate-who" hidden style="margin:8px 0 0;font-size:14px;color:var(--sub)">
      <p id="gate-email" style="margin:0"></p>
      <p id="gate-time" style="margin:0"></p>
    </div>
    <p id="gate-login" hidden style="margin:10px 0 0"><a href="login.html">로그인 화면으로</a></p>
    <div id="gate-claim" hidden style="margin:12px 0 0">
      <button class="btn" type="button" id="btn-claim">주인 명찰 받기</button>
    </div>
    <p id="gate-error" role="status" aria-live="polite" style="margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></p>
    <div style="margin:12px 0 0">
      <button class="btn ghost" type="button" id="btn-recheck">다시 확인</button>
    </div>
  </section>

  <!-- 상품 표 - 입구가 「관리자: staff · admin」 일 때만 (assets/admin-products.js) -->
  <section id="products" hidden style="margin:28px 0 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 12px">
      <h2 style="margin:0">상품</h2>
      <button class="btn" type="button" id="btn-new">새 상품</button>
    </div>
    <form id="new-form" hidden style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <label>이름 <input name="name" required style="padding:6px 8px"></label>
      <label>가격 <input name="price" type="number" required style="width:110px;padding:6px 8px"></label>
      <label>설명 <input name="summary" style="width:260px;padding:6px 8px"></label>
      <label>재고 <input name="stock" type="number" required style="width:90px;padding:6px 8px"></label>
      <button class="btn" type="submit" id="new-save">저장</button>
      <p id="new-result" role="status" style="margin:0;width:100%;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere"></p>
    </form>
    <table class="cart" style="font-size:14px">
      <thead><tr><th>문서 ID</th><th>이름</th><th>가격</th><th>재고</th><th>품절</th><th>노출</th><th></th></tr></thead>
      <tbody id="product-rows"></tbody>
    </table>
  </section>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
