<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 화면 — 하루살림</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">

<!-- 동의 배너 (태그 관리자보다 먼저) -->
<script src="assets/consent.js"></script>

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQ9XCH2B"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<!-- 이 화면은 가게 메뉴·머리글에 넣지 않는다 - 주소를 직접 넣어서 연다 -->
<main><div class="wrap">
  <h2>관리 화면</h2>

  <!-- 로그인했는지 확인하는 동안 -->
  <p id="admin-checking" class="lead">확인하는 중…</p>

  <!-- 로그인하지 않았으면 이 한 줄만 보인다 (assets/admin.js 가 연다) -->
  <p id="admin-login" hidden>로그인이 필요합니다 <a href="/login.html">로그인하기</a></p>

  <!-- 로그인한 사람에게만 보인다 (assets/admin.js 가 연다) -->
  <div id="admin-entry" hidden>
    <!-- role 이 staff · admin 이면 -->
    <div id="admin-ok-box" hidden>
      <p id="admin-ok" style="font-weight:700;margin:0 0 4px"></p>
      <p style="margin:0 0 4px">로그인 : <span id="admin-email" data-clarity-mask="true"></span></p>
      <p style="margin:0">토큰을 받은 시각 : <span id="admin-issued"></span></p>
    </div>

    <!-- 그 밖이면 -->
    <div id="admin-denied" hidden>
      <p>권한이 없습니다</p>
      <button class="btn" type="button" id="btn-grant">주인 명찰 받기</button>
    </div>

    <div id="admin-result" role="status" aria-live="polite" style="margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></div>

    <div style="margin:24px 0 0">
      <button class="btn ghost" type="button" id="btn-recheck">다시 확인</button>
    </div>

    <!-- 탭 - 입구가 「관리자: staff · admin」 일 때만 보인다 (assets/admin.js 가 연다) -->
    <div id="admin-tabs" hidden role="tablist" style="display:flex;gap:8px;margin:36px 0 0">
      <button class="btn" type="button" role="tab" data-tab="products" aria-selected="true">상품</button>
      <button class="btn ghost" type="button" role="tab" data-tab="orders" aria-selected="false">주문</button>
    </div>

    <div id="tab-products">
    <!-- 상품 표 - 입구가 「관리자: staff · admin」 일 때만 보인다 (assets/admin-products.js 가 연다) -->
    <section id="admin-products" hidden style="margin:24px 0 0">
      <h3>상품</h3>

      <button class="btn" type="button" id="btn-new-product">새 상품</button>
      <!-- 위 단추를 누르면 열린다 -->
      <div id="new-product-box" hidden style="margin:12px 0 0;max-width:420px">
        <label for="new-name">name</label>
        <input id="new-name" type="text">
        <label for="new-price">price</label>
        <input id="new-price" type="number" inputmode="numeric">
        <label for="new-summary">summary</label>
        <input id="new-summary" type="text">
        <label for="new-stock">stock</label>
        <input id="new-stock" type="number" inputmode="numeric" min="0" step="1">
        <label for="new-photo">사진</label>
        <input id="new-photo" type="file" accept="image/*">
        <button class="btn" type="button" id="btn-new-save" style="margin:12px 0 0">저장</button>
      </div>
      <p id="new-product-result" role="status" aria-live="polite" style="margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></p>

      <p id="product-list-result" role="status" aria-live="polite" style="margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></p>

      <!-- 필터 · 검색 · 정렬 - 한 번 읽어 둔 상품에서 화면이 고른다 (Firestore 에 다시 묻지 않는다) -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0 0">
        <button class="btn" type="button" data-filter="all" aria-pressed="true">전체</button>
        <button class="btn ghost" type="button" data-filter="soldout" aria-pressed="false">품절만</button>
        <button class="btn ghost" type="button" data-filter="hidden" aria-pressed="false">숨김만</button>
        <button class="btn ghost" type="button" data-filter="removed" aria-pressed="false">내린 상품</button>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 0">
        <label>이름 검색
          <input id="product-search" type="search">
        </label>
        <label>정렬
          <select id="product-sort">
            <option value="stock">재고 적은 순</option>
            <option value="name">이름순</option>
            <option value="updated">최근에 고친 순</option>
          </select>
        </label>
      </div>
      <p id="product-count" style="margin:16px 0 0;font-size:14px;font-weight:700"></p>

      <div style="overflow-x:auto;margin:8px 0 0">
        <table class="cart" id="product-table">
          <thead>
            <tr><th>사진</th><th>문서 ID</th><th>name</th><th>price</th><th>stock</th><th>품절</th><th>노출</th><th></th><th></th><th></th></tr>
          </thead>
          <!-- 상품 한 개마다 <tbody> 한 묶음 (보통 줄 + 고치기 칸) -->
        </table>
      </div>

      <!-- 최근 활동 - 함수가 adminLogs 에 남긴 것을 읽기만 한다 -->
      <h3 style="margin:36px 0 0">최근 활동</h3>
      <p id="log-result" role="status" aria-live="polite" style="margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></p>
      <div style="overflow-x:auto;margin:8px 0 0">
        <table class="cart" id="log-table">
          <thead>
            <tr><th>시각</th><th>상품</th><th>action</th><th>changedKeys</th></tr>
          </thead>
          <tbody id="log-rows"></tbody>
        </table>
      </div>

      <!-- 「내리기」 확인 창 -->
      <dialog id="remove-dialog" style="max-width:360px;border:1px solid #ccc;border-radius:10px;padding:20px">
        <form method="dialog">
          <p id="remove-text" style="margin:0 0 16px"></p>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn ghost" type="submit" value="cancel">그만두기</button>
            <button class="btn" type="submit" value="remove">내리기</button>
          </div>
        </form>
      </dialog>

      <!-- 내린 뒤 화면 아래에 뜨는 한 줄 안내 -->
      <div id="undo-bar" hidden role="status" aria-live="polite" style="position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;padding:12px 16px;border-radius:10px;background:#222;color:#fff;z-index:50">
        <div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
          <span id="undo-text" style="white-space:pre-wrap;overflow-wrap:anywhere"></span>
          <button class="btn ghost" type="button" id="btn-undo">되돌리기</button>
        </div>
      </div>
    </section>
    </div>

    <!-- 주문 탭 (assets/admin-orders.js 가 채운다) -->
    <div id="tab-orders" hidden>
    <section id="admin-orders" style="margin:24px 0 0">
      <h3>주문</h3>

      <!-- 고른 상태만 Firestore 에서 읽어 온다 -->
      <label>상태
        <select id="order-status">
          <option value="all">전체</option>
          <option value="paid">paid</option>
          <option value="preparing">preparing</option>
          <option value="shipped">shipped</option>
          <option value="delivered">delivered</option>
          <option value="canceled">canceled</option>
        </select>
      </label>

      <p id="order-list-result" role="status" aria-live="polite" style="margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></p>

      <div style="overflow-x:auto;margin:8px 0 0">
        <table class="cart" id="order-table">
          <thead>
            <tr><th>주문 번호</th><th>금액</th><th>상태</th><th>주문 시각</th></tr>
          </thead>
          <tbody id="order-rows"></tbody>
        </table>
      </div>
      <button class="btn ghost" type="button" id="btn-order-more" hidden style="margin:12px 0 0">더 보기</button>

      <!-- 줄을 누르면 열린다 -->
      <div id="order-detail" hidden style="margin:24px 0 0;padding:16px;border:1px solid #ddd;border-radius:10px;overflow-wrap:anywhere"></div>
      <p id="order-detail-result" role="status" aria-live="polite" style="margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></p>

      <!-- 상태 버튼 확인 창 -->
      <dialog id="order-dialog" style="max-width:360px;border:1px solid #ccc;border-radius:10px;padding:20px">
        <form method="dialog">
          <p id="order-dialog-text" style="margin:0 0 16px;overflow-wrap:anywhere"></p>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn ghost" type="submit" value="cancel">그만두기</button>
            <button class="btn" type="submit" value="change">바꾸기</button>
          </div>
        </form>
      </dialog>
    </section>
    </div>
  </div>
</div></main>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
