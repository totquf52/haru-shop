<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">

<script src="assets/consent.js"></script>

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">하루살림</a>
</div></header>

<main><div class="wrap">
  <h2>관리 화면</h2>

  <!-- 관리 화면 입구 - 로그인 토큰의 커스텀 클레임 role 로 판단한다 (assets/admin.js) -->
  <section id="gate" class="pay" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:560px">
    <p id="gate-status" style="margin:0;font-size:17px;font-weight:600">확인하는 중…</p>
    <div id="gate-who" hidden style="margin:8px 0 0;font-size:14px;color:var(--sub)">
      <p id="gate-email" style="margin:0"></p>
      <p id="gate-time" style="margin:0"></p>
    </div>
    <p id="gate-login" hidden style="margin:10px 0 0"><a href="login.html">로그인 화면으로</a></p>
    <div id="gate-claim" hidden style="margin:12px 0 0">
      <button class="btn" type="button" id="btn-claim">주인 명찰 받기</button>
    </div>
    <p id="gate-error" role="status" aria-live="polite" style="margin:12px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></p>
    <div style="margin:12px 0 0">
      <button class="btn ghost" type="button" id="btn-recheck">다시 확인</button>
    </div>
  </section>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
