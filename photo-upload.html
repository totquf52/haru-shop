<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 사진 올리기 — 하루살림</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- 이 화면은 가게 메뉴에 넣지 않는다 - 주소를 직접 넣어서 연다 -->
<header class="site"><div class="wrap">
  <a class="brand" href="index.html">하루살림</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>

<main><div class="wrap">
  <h2>상품 사진 올리기</h2>

  <!-- 로그인했는지 확인하는 동안 -->
  <p id="photo-checking" class="lead">로그인했는지 확인하는 중…</p>

  <!-- 로그인하지 않았으면 이 한 줄만 보인다 (assets/photo-upload.js 가 연다) -->
  <p id="photo-login" hidden>로그인한 뒤에 쓸 수 있습니다. <a href="login.html?next=photo-upload.html">로그인하기</a></p>

  <!-- 로그인한 사람에게만 보인다 (assets/photo-upload.js 가 연다) -->
  <form class="pay" id="photo-form" hidden>
    <label for="photo-product">상품</label>
    <select id="photo-product" required style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;margin:0 0 18px;font-size:15px;font-family:inherit;background:#fff">
      <option value="">상품을 불러오는 중…</option>
    </select>

    <label for="photo-file">사진 파일</label>
    <input type="file" id="photo-file" accept="image/*" required>

    <button class="btn" type="submit" id="photo-submit">사진 올리기</button>

    <!-- 진행률 · 끝났다는 한 줄 · 오류 글이 여기에 적힌다 -->
    <p id="photo-result" role="status" aria-live="polite" style="margin:16px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere"></p>
  </form>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/auth.js"></script>
<script type="module" src="assets/photo-upload.js"></script>
</body>
</html>
