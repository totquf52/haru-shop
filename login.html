<main><div class="wrap">
  <h2>로그인</h2>
  <p class="lead">이메일과 비밀번호로 가입하거나 로그인합니다.</p>
  <!-- 단추는 모두 type="button" — 폼 제출 이벤트가 생기지 않게 한다 -->
  <form class="pay" id="login-form" data-clarity-mask="true">
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="6자 이상">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" type="button" id="btn-signup">가입</button>
      <button class="btn" type="button" id="btn-login">로그인</button>
      <button class="btn ghost" type="button" id="btn-logout">로그아웃</button>
    </div>
    <div style="margin:12px 0 0">
      <button class="btn ghost" type="button" id="btn-google">Google로 계속하기</button>
    </div>
    <p style="margin:12px 0 0;font-size:13px"><a href="#" id="forgot-link">비밀번호를 잊으셨나요?</a></p>
    <!-- 위 링크를 누르면 열린다 -->
    <div id="forgot-box" hidden style="margin:12px 0 0">
      <label for="forgot-email">가입할 때 쓴 이메일</label>
      <input id="forgot-email" type="email" autocomplete="email" placeholder="name@example.com">
      <button class="btn ghost" type="button" id="btn-forgot">재설정 메일 보내기</button>
    </div>
    <p style="margin:12px 0 0;font-size:12.5px;color:var(--sub)">도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 하루살림을 다 보신 뒤 로그아웃을 눌러 주세요.</p>
    <p id="auth-result" role="status" aria-live="polite" style="margin:18px 0 0;min-height:1.5em"></p>
    <!-- 오류 문구 아래에 붙는 「다음에 할 일」 (링크나 단추) -->
    <p id="auth-next" hidden style="margin:10px 0 0;font-size:13px"></p>
  </form>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/auth.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendEmailVerification,
    sendPasswordResetEmail,
    GoogleAuthProvider,
    signInWithPopup,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  // index.html 과 같은 Firebase 설정
  const firebaseConfig = {
    apiKey: "AIzaSyC9IOJWMP2AL0JvLg_Ipq_EV0h2ChQrRAg",
    authDomain: "haru-shop-80c06.firebaseapp.com",
    projectId: "haru-shop-80c06",
    storageBucket: "haru-shop-80c06.firebasestorage.app",
    messagingSenderId: "205447160425",
    appId: "1:205447160425:web:3b845512888e3c30e7b8f8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  // 인증 메일을 한국어로 보낸다
  auth.languageCode = "ko";

  const emailBox = document.querySelector("#email");
  const passwordBox = document.querySelector("#password");
  const result = document.querySelector("#auth-result");

  const nextStep = document.querySelector("#auth-next");

  // 실패했을 때 손님에게 보일 문구 - 오류 코드와 영어 문장은 화면에 내보내지 않는다
  const ERROR_TEXT = {
    "auth/invalid-credential": "이메일 또는 비밀번호가 맞지 않아요. 다시 한번 확인해 주세요.",
    "auth/email-already-in-use": "이미 하루살림에 가입하신 이메일이에요. 로그인 화면에서 들어와 주세요.",
    "auth/weak-password": "비밀번호는 6자 이상으로 정해 주세요.",
    "auth/invalid-email": "이메일 주소에 @ 와 그 뒤 주소가 들어갔는지 봐 주세요."
  };
  // 위 표에 없는 코드일 때
  const ERROR_FALLBACK = "문제가 생겼어요. 조금 뒤에 다시 시도해 주세요.";

  // 문구 아래에 붙는 링크·단추를 오류 코드에 맞게 그린다 (해당 없으면 비운다)
  function paintNext(code) {
    nextStep.textContent = "";
    if (code === "auth/invalid-credential") {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = "비밀번호 다시 정하기";
      a.addEventListener("click", e => { e.preventDefault(); openForgot(); });
      nextStep.appendChild(a);
    } else if (code === "auth/email-already-in-use") {
      const a = document.createElement("a");
      a.className = "btn ghost";
      a.href = "login.html" + location.search;
      a.textContent = "로그인 화면으로";
      nextStep.appendChild(a);
    }
    nextStep.hidden = !nextStep.hasChildNodes();
  }

  // 성공하면 한 줄, 실패하면 위 표의 문구를 보여 준다.
  // 이메일·비밀번호는 dataLayer 에도 콘솔에도 넣지 않는다.
  async function run(doneText, action, after) {
    result.textContent = "처리 중…";
    paintNext(null);
    try {
      // action 이 글자를 돌려주면 그 글자를, 아니면 doneText 를 보여 준다
      const text = await action();
      result.textContent = text || doneText;
      if (after) after();
    } catch (err) {
      result.textContent = ERROR_TEXT[err.code] || ERROR_FALLBACK;
      paintNext(err.code);
    }
  }

  // 로그인이 필요한 화면에서 돌려보내져 왔으면(?next=mypage.html) 원래 가려던 화면으로 다시 보낸다.
  // 이 가게 안의 화면 이름(글자·숫자·줄표 + .html)일 때만 따라간다 - 바깥 주소로는 보내지 않는다.
  function goNext() {
    const next = new URLSearchParams(location.search).get("next");
    if (next && /^[a-z0-9-]+\.html$/i.test(next)) location.replace(next);
  }

  document.querySelector("#login-form").addEventListener("submit", e => e.preventDefault());

  document.querySelector("#btn-signup").addEventListener("click", () =>
    run("가입되었습니다.", async () => {
      const cred = await createUserWithEmailAndPassword(auth, emailBox.value.trim(), passwordBox.value);

      // ▼ 「가입했다」(sign_up) - 가입이 성공한 순간 (실패하면 위 줄에서 멈춰 여기까지 오지 않는다)
      // 통로가 이미 있으면 그대로 쓰고, 없을 때만 새로 만든다
      window.dataLayer = window.dataLayer || [];
      // 통로 끝에 한 덩어리를 넣는다 - 넣는 순간이 태그 관리자가 듣는 순간
      dataLayer.push({
        // 무슨 일이 일어났나 - 계획서 이름 글자 그대로
        event: "sign_up",
        // 가입 방법 - 이메일 (이메일 주소와 비밀번호는 넣지 않는다)
        method: "email"
      });

      // 가입한 주소로 인증 메일을 바로 보낸다.
      // 메일을 못 보내도 가입은 이미 된 것이라, 가입 실패처럼 보이지 않게 따로 알린다.
      try {
        await sendEmailVerification(cred.user);
        return "인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요.";
      } catch (err) {
        return "가입되었습니다. 인증 메일은 보내지 못했습니다.";
      }
    }));

  document.querySelector("#btn-login").addEventListener("click", () =>
    run("로그인되었습니다.", () =>
      signInWithEmailAndPassword(auth, emailBox.value.trim(), passwordBox.value), goNext));

  // Google 계정으로 들어온다 - 팝업 방식. 들어오면 구글 계정의 이름을 보여 준다.
  // 이름과 이메일은 화면에만 적고 dataLayer 에도 콘솔에도 넣지 않는다.
  document.querySelector("#btn-google").addEventListener("click", () =>
    run("Google 계정으로 들어왔습니다.", async () => {
      try {
        const cred = await signInWithPopup(auth, new GoogleAuthProvider());
        const name = cred.user.displayName;
        return name ? name + "님, Google 계정으로 들어왔습니다." : "";
      } catch (err) {
        // 손님이 팝업을 그냥 닫은 것은 오류로 알리지 않는다
        if (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request") return " ";
        throw err;
      }
    }));

  document.querySelector("#btn-logout").addEventListener("click", () =>
    run("로그아웃되었습니다.", () => signOut(auth)));

  /* --- 비밀번호 재설정 --- */
  const forgotBox = document.querySelector("#forgot-box");
  const forgotEmail = document.querySelector("#forgot-email");

  // 링크를 누르면 이메일 칸을 연다 (위 칸에 적어 둔 이메일이 있으면 옮겨 적는다)
  function openForgot() {
    forgotBox.hidden = false;
    if (!forgotEmail.value) forgotEmail.value = emailBox.value.trim();
    forgotEmail.focus();
  }
  document.querySelector("#forgot-link").addEventListener("click", e => {
    e.preventDefault();
    openForgot();
  });

  // 재설정 메일을 보낸다 - 메일 언어는 위에서 정한 한국어(auth.languageCode)
  document.querySelector("#btn-forgot").addEventListener("click", () => {
    const address = forgotEmail.value.trim();
    if (!address) { result.textContent = "이메일을 입력해 주세요."; paintNext(null); return; }
    run("메일을 보냈습니다. 가입된 주소라면 곧 도착합니다.", async () => {
      try {
        await sendPasswordResetEmail(auth, address);
      } catch (err) {
        // 가입되지 않은 주소여도 같은 한 줄을 보여 준다 - 가입 여부를 알려 주지 않는다
        if (err.code !== "auth/user-not-found") throw err;
      }
    });
  });
</script>
</body>
