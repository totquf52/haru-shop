<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 — 하루살림</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">

<!-- 동의 배너 (태그 관리자보다 먼저) -->
<script src="assets/consent.js"></script>

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

</head>
<!-- data-require-login : 로그인하지 않았으면 assets/auth.js 가 login.html 로 돌려보낸다 -->
<body data-require-login>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQ9XCH2B"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">하루살림</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>

<!-- 로그인 확인이 끝나기 전에는 hidden 으로 가려 둔다 -->
<main data-auth-show hidden><div class="wrap">
  <h2>마이페이지</h2>
  <p class="lead">로그인한 계정입니다.</p>
  <p data-auth-email data-clarity-mask="true" style="font-weight:700;margin:0 0 24px"></p>
  <!-- 메일 인증이 안 된 계정에만 보인다 (assets/auth.js 가 연다) -->
  <div data-auth-unverified hidden style="margin:0 0 24px">
    <p style="margin:0 0 12px">아직 이메일 인증이 되지 않았습니다. 받은 메일의 링크를 눌러 주세요.</p>
    <button class="btn" type="button" data-auth-resend>인증 메일 다시 보내기</button>
    <p data-auth-resend-result role="status" aria-live="polite" style="margin:12px 0 0;font-size:13px;color:var(--sub)"></p>
  </div>
  <!-- 구글 계정 연결 - 이미 붙어 있으면 단추 대신 「연결됨」 (assets/auth.js 가 고른다) -->
  <div style="margin:0 0 24px">
    <p style="margin:0 0 8px;font-size:13px;color:var(--sub)">구글 계정</p>
    <button class="btn" type="button" data-auth-link-google hidden>구글 계정 연결하기</button>
    <span data-auth-linked-google hidden>연결됨</span>
    <p data-auth-link-result role="status" aria-live="polite" style="margin:12px 0 0;font-size:13px;color:var(--sub)"></p>
  </div>
  <!-- 내 주문 - 로그인한 사람의 주문만 Firestore 에서 듣는다 (assets/orders.js 가 그린다) -->
  <h2 style="margin-top:8px">내 주문</h2>
  <div id="order-list" style="margin:0 0 32px"></div>
  <button class="btn ghost" type="button" data-auth-logout>로그아웃</button>
  <!-- 탈퇴 - 로그인 계정 자체를 지운다 (assets/auth.js 가 붙인다) · Firestore 문서는 화면이 아니라 함수가 지운다 -->
  <div style="margin:32px 0 0">
    <button class="btn ghost" type="button" data-auth-withdraw>탈퇴하기</button>
    <p data-auth-withdraw-result role="status" aria-live="polite" style="margin:12px 0 0;font-size:13px;color:var(--sub)"></p>
  </div>
  <!-- 탈퇴 확인 창 -->
  <dialog data-auth-withdraw-dialog style="max-width:360px;border:1px solid #ccc;border-radius:10px;padding:20px">
    <form method="dialog">
      <p style="margin:0 0 16px">탈퇴하면 이 계정으로 다시 로그인할 수 없습니다. 주문 기록은 법이 정한 기간 동안 남습니다.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn ghost" type="submit" value="cancel">그만두기</button>
        <button class="btn" type="submit" value="withdraw">탈퇴하기</button>
      </div>
    </form>
  </dialog>
</div></main>
<footer class="site"><div class="wrap"></div>
<!-- 처리방침 링크 - 위 .wrap 은 app.js 가 가게 이름으로 덮어쓰므로 따로 한 줄 -->
<div class="wrap" style="margin-top:8px"><a href="privacy.html">개인정보 처리방침</a></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/auth.js"></script>
<script type="module" src="assets/orders.js"></script>
</body>
</html>
